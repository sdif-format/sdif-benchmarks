[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdif-benchmarks"
version = "1.0.0"
description = "Benchmark suite for SDIF format comparisons"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "anthropic>=0.103.1",
  "pytest>=8.0",
  "tiktoken>=0.13.0",
  "transformers>=4",
  "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["scripts", "src", "tests"]
target-version = "py310"

[tool.setuptools]
py-modules = []
